name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Write SSH key properly (preserve formatting)
      - name: Prepare SSH key
        run: |
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      # Step 2: Debug key (VERY IMPORTANT for you)
      - name: Debug SSH key
        run: |
          echo "LINES:"
          wc -l key.pem
          echo "FIRST LINE:"
          head -n 1 key.pem

      # Step 3: Deploy using key_path (not key)
      - name: Deploy to GCP Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: /github/workspace/key.pem
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 20m
          debug: true
          script: |
            set -e

            echo "Connected to server"

            cd /var/www/html/goliteapi

            git config --global --add safe.directory /var/www/html/goliteapi

            git stash || true
            git pull origin main
            git stash drop || true

            source venv/bin/activate
            pip install -r requirements.txt

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl restart gunicorn
            sudo systemctl restart nginx