name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug SSH key
        run: |
          echo "Key length in chars:"
          echo -n "${{ secrets.SSH_PRIVATE_KEY }}" | wc -c
          echo "Key line count:"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | wc -l
          echo "First line:"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | head -n 1
          echo "Last line:"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tail -n 1

      - name: Test raw SSH (bypass appleboy)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 || echo "KEY IS INVALID/CORRUPT"
